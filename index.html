<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark</title>
    <link rel="icon" href="images/icon.png">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <div class="vh-100 position-relative" id="myBody">

        <div class="text-center">
            <h1 class="pt-5">Bookmarker</h1>
        </div>

        <div class="container py-2">
            <h2 class="text-center"><i class="fa-solid fa-bookmark"></i>Bookmark your favorite sites<i
                class="fa-solid fa-bookmark"></i>
            </h2>


            <div class="row ">

                <div class="form pb-4">
                    <div class="mb-3 my-2">
                        <label for="SiteName" class="form-label "><i class="fa-solid fa-book-bookmark me-2 "></i>Site Name</label>
                        <input type="text" class="form-control" id="SiteName" placeholder="Bookmark Name">
                    </div>

                    <div class="mb-3 my-2">
                        <label for="SiteURL" class="form-label"><i class="fa-solid fa-link me-2"></i>Site URL</label>
                        <input type="url" class="form-control" id="SiteURL" placeholder="Website URL">
                    </div>

                    <button onclick="addBook()" class="btn btn-danger d-block m-auto">Submit</button>


                </div>
            </div>

            <table class="table my-5 text-center">
                <thead>
                    <tr>
                        <th scope="col">Index</th>
                        <th scope="col">Website Name</th>
                        <th scope="col">Visit</th>
                        <th scope="col">Delete</th>
                    </tr>
                </thead>
                <tbody id="tableBody">

                </tbody>
            </table>

            <div id="my-body-layer" class="d-none "></div>
        </div>




        <div class="popup bg-white py-4 px-4 d-none" id="popup">
            <div class="row justify-content-between">


                <div class="dots py-3 col-11  d-flex column-gap-2 ">
                    <div class="red-circle"></div>
                    <div class="yellow-circle"></div>
                    <div class="green-circle"></div>
                </div>

                <div class="col-1 py-3">
                    <button onclick="closePopup()" id="closeButton"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <p class="max-width-500">Site Name or Url is not valid, Please follow the rules below :</p>
                <span class="col-12"><i class="fa-regular fa-circle-right  pe-4 text-danger"></i>Site name must contain at least 3 characters.</span>
                <span class="pb-3"><i class="fa-regular fa-circle-right  pe-4 text-danger"></i>Site URL must be a valid one.</span>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
